<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">D</div>
      <div>
        <h1>DevWorkspace</h1>
        <span>Personal developer space</span>
      </div>
    </div>

    <div class="nav-label">WORKSPACE</div>

    <nav class="navigation">
      <a class="nav-item"
         routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <span>⌂</span> Dashboard
      </a>

      <a class="nav-item"
         routerLink="/documents"
         routerLinkActive="active">
        <span>▤</span> Documents
      </a>

      <a class="nav-item"
         routerLink="/prompts"
         routerLinkActive="active">
        <span>✧</span> Prompt Library
      </a>

      <a class="nav-item"
         routerLink="/markdown-generator"
         routerLinkActive="active">
        <span>⚙</span> Agent &amp; Markdown Generator
      </a>

      <a class="nav-item"
         routerLink="/architecture-library"
         routerLinkActive="active">
        <span>◈</span> Architecture Library
      </a>

      <a class="nav-item" href="#" (click)="$event.preventDefault()">
        <span>▧</span> Documentation
      </a>

      <a class="nav-item" href="#" (click)="$event.preventDefault()">
        <span>✓</span> Task Manager
      </a>

      <a class="nav-item" href="#" (click)="$event.preventDefault()">
        <span>&lt;/&gt;</span> Code Snippets
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="status-dot"></div>
      <span>Personal workspace</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumb">
        Workspace <span>/</span>
        {{ currentPageTitle }}
      </div>
      <div class="user-avatar">DW</div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
