<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">D</div>
      <div>
        <h1>DevWorkspace</h1>
        <span>Personal developer space</span>
      </div>
    </div>

    <div class="nav-label">WORKSPACE</div>

    <nav class="navigation">

      <a class="nav-item"
         routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">

        <lucide-icon [img]="House" [size]="18"></lucide-icon>
        Dashboard
      </a>

      <a class="nav-item"
         routerLink="/documents"
         routerLinkActive="active">

        <lucide-icon [img]="FileText" [size]="18"></lucide-icon>
        Documents
      </a>

      <a class="nav-item"
         routerLink="/prompts"
         routerLinkActive="active">

        <lucide-icon [img]="Sparkles" [size]="18"></lucide-icon>
        Prompt Library
      </a>

      <a class="nav-item"
         routerLink="/markdown-generator"
         routerLinkActive="active">

        <lucide-icon [img]="Bot" [size]="18"></lucide-icon>
        Agent & Markdown Generator
      </a>

      <a class="nav-item"
         routerLink="/architecture-library"
         routerLinkActive="active">

        <lucide-icon [img]="Workflow" [size]="18"></lucide-icon>
        Architecture Library
      </a>

      <a class="nav-item"
         routerLink="/documentation"
         routerLinkActive="active">

        <lucide-icon [img]="BookOpen" [size]="20"></lucide-icon>
        <span>Documentation</span>
      </a>

      <a class="nav-item"
         routerLink="/tasks"
         routerLinkActive="active">
        <lucide-icon [img]="ListTodo" [size]="18"></lucide-icon>
        Task Manager
      </a>

      <a class="nav-item"
         routerLink="/workspace"
         routerLinkActive="active">

        <lucide-icon [img]="Layers" [size]="18"></lucide-icon>
        Workspace
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="status-dot"></div>
      <span>Personal workspace</span>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumb">
        Workspace <span>/</span>
        {{ currentPageTitle }}
      </div>
      <div class="user-avatar">DW</div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
