
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: developerworkspace
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/adam026/developerworkspace-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: MongoDbSettings__ConnectionString
              value: "mongodb://mongodb:27017"
            - name: MongoDbSettings__DatabaseName
              value: "DeveloperWorkspace"
            - name: Ollama__BaseUrl
              value: "http://host.docker.internal:11434/"
          readinessProbe:
            httpGet:
              path: /openapi/v1.json
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /openapi/v1.json
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: developerworkspace
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
