apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developerworkspace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/adam026/DeveloperWorkspace.git
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: developerworkspace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true