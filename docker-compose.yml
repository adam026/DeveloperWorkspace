services:
  mongodb:
    image: mongo:8
    container_name: developerworkspace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    container_name: developerworkspace-backend
    build:
      context: ./DeveloperWorkspace.Api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      Ollama__BaseUrl: "http://host.docker.internal:11434/"

  frontend:
    container_name: developerworkspace-frontend
    build:
      context: ./developer-workspace-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongodb_data: